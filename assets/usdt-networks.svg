<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Сеть у отправителя и получателя должна совпадать</title>
<desc id="desc">Первая строка: биржа отправляет в сети TRON, кошелёк ждёт TRON, перевод дойдёт. Вторая строка: биржа отправляет в сети Ethereum, кошелёк ждёт TRON, перевод не дойдёт. Внизу: комиссию платят в монете сети, в TRON это TRX, в Ethereum ETH, в BNB Smart Chain BNB.</desc>
<rect width="1200" height="675" rx="28" fill="#f7f5ef"/>
<text x="60" y="92" font-family="Literata, Georgia, serif" font-size="48" font-weight="700" fill="#1e2a2f">Сеть должна совпадать</text>
<g font-family="Commissioner, Arial, sans-serif" font-weight="700">
<rect x="60" y="140" width="330" height="130" rx="20" fill="#fffefa" stroke="#1e2a2f" stroke-width="4"/>
<text x="225" y="195" font-size="34" fill="#5d696d" text-anchor="middle">Биржа</text>
<text x="225" y="245" font-size="40" fill="#1e2a2f" text-anchor="middle">TRON</text>
<path d="M410 205H600" stroke="#466b67" stroke-width="12" stroke-linecap="round"/><path d="M580 180l30 25-30 25" fill="none" stroke="#466b67" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="630" y="140" width="330" height="130" rx="20" fill="#fffefa" stroke="#1e2a2f" stroke-width="4"/>
<text x="795" y="195" font-size="34" fill="#5d696d" text-anchor="middle">Кошелёк</text>
<text x="795" y="245" font-size="40" fill="#1e2a2f" text-anchor="middle">TRON</text>
<circle cx="1050" cy="205" r="42" fill="#21654d"/><path d="M1030 205l14 15 26-30" fill="none" stroke="#fffefa" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1050" y="290" font-size="30" fill="#21654d" text-anchor="middle">Дойдёт</text>

<rect x="60" y="320" width="330" height="130" rx="20" fill="#fffefa" stroke="#1e2a2f" stroke-width="4"/>
<text x="225" y="375" font-size="34" fill="#5d696d" text-anchor="middle">Биржа</text>
<text x="225" y="425" font-size="40" fill="#1e2a2f" text-anchor="middle">Ethereum</text>
<path d="M410 385H600" stroke="#a84f2a" stroke-width="12" stroke-linecap="round" stroke-dasharray="22 18"/><path d="M580 360l30 25-30 25" fill="none" stroke="#a84f2a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="630" y="320" width="330" height="130" rx="20" fill="#fffefa" stroke="#1e2a2f" stroke-width="4"/>
<text x="795" y="375" font-size="34" fill="#5d696d" text-anchor="middle">Кошелёк</text>
<text x="795" y="425" font-size="40" fill="#1e2a2f" text-anchor="middle">TRON</text>
<circle cx="1050" cy="385" r="42" fill="#923a35"/><path d="M1033 368l34 34M1067 368l-34 34" stroke="#fffefa" stroke-width="10" stroke-linecap="round"/>
<text x="1050" y="470" font-size="30" fill="#923a35" text-anchor="middle">Не дойдёт</text>
</g>
<rect x="60" y="520" width="1080" height="100" rx="20" fill="#e7dfd3"/>
<text x="600" y="583" font-family="Commissioner, Arial, sans-serif" font-size="32" font-weight="600" fill="#1e2a2f" text-anchor="middle">Комиссию платят в монете сети: TRX, ETH или BNB</text>
</svg>
